<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        <div>
          <label for="name">Customer Name:</label>
          <input type="text" id="name" name="name" required pattern=".*\S.*\S.*" title="Name must contain at least two characters.">
        </div>

        <div>
          <label for="email">Email Address:</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div>
          <label for="colour">Choose a Colour:</label>
          <select id="colour" name="colour" required>
            <option value="">--Please choose a colour--</option>
            <option value="red">Red</option>
            <option value="blue">Blue</option>
            <option value="green">Green</option>
          </select>
        </div>

        <div>
          <label for="size">Choose a Size:</label>
          <select id="size" name="size" required>
            <option value="">--Please choose a size--</option>
            <option value="XS">XS</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="Xl">XL</option>
            <option value="XXL">XXL</option>
          </select>
        </div>

        <div>
          <button type="submit">Submit Order</button>
        </div>
      </form>
    </main>
    <footer>
      <!-- Replace 'YOUR NAME' below with your real name -->
      <p>By Sima Nongawuza</p>
    </footer>
  </body>
</html>
